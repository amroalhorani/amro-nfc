<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Table</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #111, #1c1c1c);
  color: white;
  text-align: center;
}

h1 {
  padding: 20px;
  font-size: 34px;
}

.lang-btn {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 10px;
  background: #ff6600;
  border: none;
  color: white;
  font-size: 16px;
}

.container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
  padding: 20px;
}

.card {
  background: #222;
  padding: 25px;
  border-radius: 20px;
  font-size: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card span {
  cursor: pointer;
}

.mic {
  font-size: 22px;
  cursor: pointer;
}

.big {
  background: #ff6600;
}

#content {
  padding: 20px;
}

/* 🔥 تصميم الألعاب */
.games-grid {
  display: grid;
  gap: 15px;
  margin-top: 15px;
}

.game-card {
  background: #222;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
  transition: 0.3s;
}

.game-card:hover {
  transform: scale(1.03);
}

.game-icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.game-title {
  font-size: 20px;
  margin-bottom: 10px;
}

.game-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.game-card button {
  background: #ff6600;
  border: none;
  padding: 10px 15px;
  border-radius: 10px;
  color: white;
  cursor: pointer;
}

.mic-btn {
  background: #444;
}

img {
  width: 95%;
  margin: 10px;
  border-radius: 10px;
}

iframe {
  width: 95%;
  height: 220px;
}
</style>
</head>

<body>

<h1>🍽️ Smart Table</h1>

<button class="lang-btn" onclick="setLang('ar')">عربي</button>
<button class="lang-btn" onclick="setLang('en')">English</button>

<div class="container">

<div class="card">
<span onclick="showMenu()"><span id="menuText">📖 المنيو</span></span>
<span class="mic" onclick="speak('menu')">🎤</span>
</div>

<div class="card">
<span onclick="openLocation()"><span id="locText">📍 الموقع</span></span>
<span class="mic" onclick="speak('location')">🎤</span>
</div>

<div class="card">
<span onclick="showVideo()"><span id="videoText">🎥 فيديو</span></span>
<span class="mic" onclick="speak('video')">🎤</span>
</div>

<div class="card big">
<span onclick="callWaiter()"><span id="waiterText">🚨 نداء ويتر</span></span>
<span class="mic" onclick="speak('waiter')">🎤</span>
</div>

<div class="card">
<span onclick="requestBill()"><span id="billText">💰 الفاتورة</span></span>
<span class="mic" onclick="speak('bill')">🎤</span>
</div>

<div class="card">
<span onclick="showGames()"><span id="gamesText">🎮 ألعاب</span></span>
<span class="mic" onclick="speak('games')">🎤</span>
</div>

</div>

<div id="content"></div>

<script>

let lang = "ar";

const text = {
  ar: {
    menu: "المنيو",
    location: "الموقع",
    video: "فيديو",
    waiter: "نداء ويتر",
    games: "ألعاب",
    bill: "الفاتورة",
    play: "العب الآن"
  },
  en: {
    menu: "Menu",
    location: "Location",
    video: "Video",
    waiter: "Call Waiter",
    games: "Games",
    bill: "Bill",
    play: "Play Now"
  }
};

function setLang(l){
  lang = l;

  document.getElementById("menuText").innerText = "📖 " + text[l].menu;
  document.getElementById("locText").innerText = "📍 " + text[l].location;
  document.getElementById("videoText").innerText = "🎥 " + text[l].video;
  document.getElementById("waiterText").innerText = "🚨 " + text[l].waiter;
  document.getElementById("gamesText").innerText = "🎮 " + text[l].games;
  document.getElementById("billText").innerText = "💰 " + text[l].bill;
}

function speak(type){
  const msg = new SpeechSynthesisUtterance(text[lang][type]);
  msg.lang = lang === "ar" ? "ar-SA" : "en-US";
  speechSynthesis.speak(msg);
}

function speakCustom(textToSpeak){
  const msg = new SpeechSynthesisUtterance(textToSpeak);
  msg.lang = lang === "ar" ? "ar-SA" : "en-US";
  speechSynthesis.speak(msg);
}

function showMenu(){
  document.getElementById("content").innerHTML = `
    <h2>${text[lang].menu}</h2>
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194629/1_fr367x.jpg">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/9_ljn4uk.jpg">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/4_joqmep.jpg">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/5_azsne8.jpg">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/6_fv3i5l.jpg">
  `;
  window.scrollTo({top: content.offsetTop, behavior: "smooth"});
}

function openLocation(){
  window.open("https://maps.google.com/?q=Amman", "_blank");
}

function showVideo(){
  document.getElementById("content").innerHTML = `
    <h2>${text[lang].video}</h2>
    <iframe src="https://www.youtube.com/embed/5QG4drW8zdY" allowfullscreen></iframe>
  `;
  window.scrollTo({top: content.offsetTop, behavior: "smooth"});
}

function callWaiter(){
  const table = 5;
  fetch("https://script.google.com/macros/s/AKfycbwoDcztWW5XV8zeyniCKI97adi1w8uPVzCZ_TohYwLq1Hc7jSq_gkO9Y-R925fM62iU/exec?table=" + table + "&type=waiter&key=012305");
  alert("تم طلب الويتر للطاولة " + table);
}

function requestBill(){
  const table = 5;
  window.open("bill.html?table=" + table, "_blank");
}

/* 🔥 الألعاب الجديدة */
function showGames(){
  document.getElementById("content").innerHTML = `
    <h2>${text[lang].games}</h2>

    <div class="games-grid">

      <div class="game-card">
        <div class="game-icon">🎨</div>
        <div class="game-title">Skribbl.io</div>
        <div class="game-actions">
          <button onclick="window.open('https://skribbl.io')">▶️ ${text[lang].play}</button>
          <button class="mic-btn" onclick="speakCustom('Skribbl game')">🎤</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">😂</div>
        <div class="game-title">Gartic Phone</div>
        <div class="game-actions">
          <button onclick="window.open('https://garticphone.com')">▶️ ${text[lang].play}</button>
          <button class="mic-btn" onclick="speakCustom('Gartic Phone game')">🎤</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">🧠</div>
        <div class="game-title">Codenames</div>
        <div class="game-actions">
          <button onclick="window.open('https://www.codenames.game')">▶️ ${text[lang].play}</button>
          <button class="mic-btn" onclick="speakCustom('Codenames game')">🎤</button>
        </div>
      </div>

      <div class="game-card">
        <div class="game-icon">🕵️</div>
        <div class="game-title">Mafia</div>
        <div class="game-actions">
          <button onclick="window.open('https://www.jm3tmafia.com/game')">▶️ ${text[lang].play}</button>
          <button class="mic-btn" onclick="speakCustom('Mafia game')">🎤</button>
        </div>
      </div>

    </div>
  `;

  window.scrollTo({top: content.offsetTop, behavior: "smooth"});
}

</script>

</body>
</html>
