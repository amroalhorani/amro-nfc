<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Table</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #111, #1c1c1c);
  color: white;
  text-align: center;
}

h1 {
  padding: 20px;
  font-size: 34px;
}

.lang-btn {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 10px;
  background: #ff6600;
  border: none;
  color: white;
  font-size: 16px;
}

.container {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
  padding: 20px;
}

.card {
  background: #222;
  padding: 25px;
  border-radius: 20px;
  font-size: 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card span {
  cursor: pointer;
}

.mic {
  font-size: 22px;
  cursor: pointer;
}

.big {
  background: #ff6600;
}

#content {
  padding: 20px;
}

img {
  width: 95%;
  margin: 10px;
  border-radius: 10px;
}

iframe {
  width: 95%;
  height: 220px;
}

a {
  display: block;
  margin: 10px;
  color: #00ccff;
  font-size: 18px;
}
</style>
</head>

<body>

<h1>🍽️ Smart Table</h1>

<button class="lang-btn" onclick="setLang('ar')">عربي</button>
<button class="lang-btn" onclick="setLang('en')">English</button>

<div class="container">

<div class="card">
<span onclick="showMenu()"><span id="menuText">📖 المنيو</span></span>
<span class="mic" onclick="speak('menu')">🎤</span>
</div>

<div class="card">
<span onclick="openLocation()"><span id="locText">📍 الموقع</span></span>
<span class="mic" onclick="speak('location')">🎤</span>
</div>

<div class="card">
<span onclick="showVideo()"><span id="videoText">🎥 فيديو</span></span>
<span class="mic" onclick="speak('video')">🎤</span>
</div>

<div class="card big">
<span onclick="callWaiter()"><span id="waiterText">🚨 نداء ويتر</span></span>
<span class="mic" onclick="speak('waiter')">🎤</span>
</div>

<div class="card">
<span onclick="showGames()"><span id="gamesText">🎮 ألعاب</span></span>
<span class="mic" onclick="speak('games')">🎤</span>
</div>

</div>

<div id="content"></div>

<script>

let lang = "ar";

const text = {
  ar: {
    menu: "المنيو",
    location: "الموقع",
    video: "فيديو",
    waiter: "نداء ويتر",
    games: "ألعاب"
  },
  en: {
    menu: "Menu",
    location: "Location",
    video: "Video",
    waiter: "Call Waiter",
    games: "Games"
  }
};

function setLang(l){
  lang = l;
  document.getElementById("menuText").innerText = text[l].menu;
  document.getElementById("locText").innerText = text[l].location;
  document.getElementById("videoText").innerText = text[l].video;
  document.getElementById("waiterText").innerText = text[l].waiter;
  document.getElementById("gamesText").innerText = text[l].games;
}

// 🎤 الصوت
function speak(type){
  const msg = new SpeechSynthesisUtterance(text[lang][type]);
  msg.lang = lang === "ar" ? "ar-SA" : "en-US";
  speechSynthesis.speak(msg);
}

// المنيو
function showMenu(){
  document.getElementById("content").innerHTML = `
    <h2>${text[lang].menu}</h2>

    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194629/1_fr367x.jpg" style="width:100%;">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/9_ljn4uk.jpg" style="width:100%;">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/4_joqmep.jpg" style="width:100%;">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/5_azsne8.jpg" style="width:100%;">
    <img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/6_fv3i5l.jpg" style="width:100%;">
  `;
}

// الموقع
function openLocation(){
  window.open("https://maps.google.com/?q=Amman", "_blank");
}

// الفيديو
function showVideo(){
  document.getElementById("content").innerHTML = `
    <h2>${text[lang].video}</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/5QG4drW8zdY?si=ZmSLNz8yzcHsQXTR" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  `;
}

// الويتر
function callWaiter(){
  const table = 5;

  fetch("https://script.google.com/macros/s/AKfycbzCKOX3kONRiD36LrnsS93Flt1nRJsCu4gKCp3mzCgF833XVuUQ_HLdZo0Rq9nttFUs/exec?table=" + table + "&type=waiter&key=012305");

  alert("تم طلب الويتر للطاولة " + table);
}

// الألعاب
function showGames(){
  document.getElementById("content").innerHTML = `
    <h2>${text[lang].games}</h2>

    <a href="https://skribbl.io" target="_blank">🎨 لعبة رسم</a>
    <a href="https://garticphone.com" target="_blank">😂 لعبة جماعية</a>
    <a href="https://www.codenames.game" target="_blank">🧠 لعبة ذكاء</a>
  `;
}

</script>

</body>
</html>
