<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Table</title>

<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: #1a1a1a;
  color: #f5e6d3;
}

/* 🔥 هيدر فاخر */
.header {
  background: linear-gradient(90deg, #3e2723, #5d4037);
  padding: 20px;
  text-align: center;
  font-size: 30px;
  color: #ffcc80;
  letter-spacing: 2px;
}

/* أزرار اللغة */
.lang {
  text-align: center;
  margin: 15px;
}

.lang button {
  background: #6d4c41;
  border: none;
  padding: 8px 15px;
  border-radius: 20px;
  color: white;
  margin: 5px;
  cursor: pointer;
}

/* 🔥 شبكة أزرار مثل تطبيقات */
.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}

/* 🔥 كروت مربعة */
.card {
  background: linear-gradient(145deg, #4e342e, #3e2723);
  border-radius: 25px;
  padding: 25px 10px;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-5px);
}

.icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.title {
  font-size: 18px;
  margin-bottom: 10px;
}

.mic {
  font-size: 20px;
  cursor: pointer;
}

/* زر الويتر مميز */
.big {
  grid-column: span 2;
  background: linear-gradient(90deg, #bf360c, #ff5722);
}

/* المحتوى */
#content {
  padding: 20px;
  text-align: center;
}

/* الألعاب */
.games-grid {
  display: grid;
  gap: 15px;
}

.game-card {
  background: #3e2723;
  padding: 20px;
  border-radius: 20px;
}

.game-card button {
  margin: 5px;
  padding: 8px 12px;
  border: none;
  border-radius: 10px;
  background: #bf360c;
  color: white;
}

.mic-btn {
  background: #6d4c41;
}
</style>
</head>

<body>

<div class="header">🍽️ Smart Table</div>

<div class="lang">
  <button onclick="setLang('ar')">عربي</button>
  <button onclick="setLang('en')">English</button>
</div>

<div class="container">

<div class="card" onclick="showMenu()">
  <div class="icon">📖</div>
  <div class="title" id="menuText">المنيو</div>
  <div class="mic" onclick="event.stopPropagation(); speak('menu')">🎤</div>
</div>

<div class="card" onclick="openLocation()">
  <div class="icon">📍</div>
  <div class="title" id="locText">الموقع</div>
  <div class="mic" onclick="event.stopPropagation(); speak('location')">🎤</div>
</div>

<div class="card" onclick="showVideo()">
  <div class="icon">🎥</div>
  <div class="title" id="videoText">فيديو</div>
  <div class="mic" onclick="event.stopPropagation(); speak('video')">🎤</div>
</div>

<div class="card" onclick="requestBill()">
  <div class="icon">💰</div>
  <div class="title" id="billText">الفاتورة</div>
  <div class="mic" onclick="event.stopPropagation(); speak('bill')">🎤</div>
</div>

<div class="card big" onclick="callWaiter()">
  <div class="icon">🚨</div>
  <div class="title" id="waiterText">نداء ويتر</div>
  <div class="mic" onclick="event.stopPropagation(); speak('waiter')">🎤</div>
</div>

<div class="card" onclick="showGames()">
  <div class="icon">🎮</div>
  <div class="title" id="gamesText">ألعاب</div>
  <div class="mic" onclick="event.stopPropagation(); speak('games')">🎤</div>
</div>

</div>

<div id="content"></div>

<script>

let lang = "ar";

const text = {
  ar: {
    menu: "المنيو",
    location: "الموقع",
    video: "فيديو",
    waiter: "نداء ويتر",
    games: "ألعاب",
    bill: "الفاتورة",
    play: "العب الآن"
  },
  en: {
    menu: "Menu",
    location: "Location",
    video: "Video",
    waiter: "Call Waiter",
    games: "Games",
    bill: "Bill",
    play: "Play Now"
  }
};

function setLang(l){
  lang = l;
  menuText.innerText = text[l].menu;
  locText.innerText = text[l].location;
  videoText.innerText = text[l].video;
  waiterText.innerText = text[l].waiter;
  gamesText.innerText = text[l].games;
  billText.innerText = text[l].bill;
}

function speak(type){
  const msg = new SpeechSynthesisUtterance(text[lang][type]);
  msg.lang = lang === "ar" ? "ar-SA" : "en-US";
  speechSynthesis.speak(msg);
}

function speakCustom(t){
  const msg = new SpeechSynthesisUtterance(t);
  msg.lang = lang === "ar" ? "ar-SA" : "en-US";
  speechSynthesis.speak(msg);
}

function showMenu(){
  content.innerHTML = "<h2>"+text[lang].menu+"</h2>";
}

function openLocation(){
  window.open("https://maps.google.com/?q=Amman");
}

function showVideo(){
  content.innerHTML = '<iframe src="https://www.youtube.com/embed/5QG4drW8zdY"></iframe>';
}

function callWaiter(){
  fetch("https://script.google.com/macros/s/AKfycbwoDcztWW5XV8zeyniCKI97adi1w8uPVzCZ_TohYwLq1Hc7jSq_gkO9Y-R925fM62iU/exec?table=5&type=waiter&key=012305");
  alert("تم طلب الويتر");
}

function requestBill(){
  window.open("bill.html?table=5");
}

function showGames(){
  content.innerHTML = `
    <div class="games-grid">
      <div class="game-card">
        🎨 Skribbl
        <br>
        <button onclick="window.open('https://skribbl.io')">${text[lang].play}</button>
        <button class="mic-btn" onclick="speakCustom('Skribbl')">🎤</button>
      </div>
    </div>
  `;
}

</script>

</body>
</html>
