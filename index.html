<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Table</title>

<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: linear-gradient(135deg, #3e2723, #1b1b1b);
  color: #f5e6d3;
  text-align: center;
}

h1 {
  padding: 20px;
  font-size: 34px;
  color: #ffcc80;
}

.lang-btn {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 20px;
  background: #6d4c41;
  border: none;
  color: white;
}

.container {
  display: grid;
  gap: 15px;
  padding: 20px;
}

.card {
  background: #4e342e;
  padding: 25px;
  border-radius: 20px;
  font-size: 22px;
  display: flex;
  justify-content: space-between;
}

.big {background:#bf360c;}

#content {padding:20px;}

.menu-item{
  background:#4e342e;
  padding:15px;
  margin:10px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#bf360c;
  color:white;
  cursor:pointer;
}

.cart{
  background:#2e1c18;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>🍽️ Smart Table</h1>

<button onclick="setLang('ar')" class="lang-btn">عربي</button>
<button onclick="setLang('en')" class="lang-btn">English</button>

<div class="container">

<div class="card">
<span onclick="showMenu()" id="menuText">📖 المنيو</span>
<span onclick="speak('menu')">🎤</span>
</div>

<!-- 🔥 زر جديد -->
<div class="card big">
<span onclick="showOrderMenu()" id="orderText">🛒 اطلب الآن</span>
<span onclick="speak('order')">🎤</span>
</div>

<div class="card">
<span onclick="callWaiter()" id="waiterText">🚨 نداء ويتر</span>
<span onclick="speak('waiter')">🎤</span>
</div>

<div class="card">
<span onclick="requestBill()" id="billText">💰 الفاتورة</span>
<span onclick="speak('bill')">🎤</span>
</div>

</div>

<div id="content"></div>

<script>

let lang="ar";

const text={
ar:{
menu:"المنيو",
order:"اطلب الآن",
waiter:"نداء ويتر",
bill:"الفاتورة",
send:"إرسال الطلب",
yourOrder:"طلبك",
total:"المجموع"
},
en:{
menu:"Menu",
order:"Order Now",
waiter:"Call Waiter",
bill:"Bill",
send:"Send Order",
yourOrder:"Your Order",
total:"Total"
}
};

function setLang(l){
lang=l;
menuText.innerText="📖 "+text[l].menu;
orderText.innerText="🛒 "+text[l].order;
waiterText.innerText="🚨 "+text[l].waiter;
billText.innerText="💰 "+text[l].bill;
}

function speak(type){
const msg=new SpeechSynthesisUtterance(text[lang][type]);
msg.lang=lang==="ar"?"ar-SA":"en-US";
speechSynthesis.speak(msg);
}

// 🖼️ المنيو (صور فقط)
function showMenu(){
content.innerHTML=`
<h2>${text[lang].menu}</h2>

<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194629/1_fr367x.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/9_ljn4uk.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/4_joqmep.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/5_azsne8.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/6_fv3i5l.jpg">
`;
}

// 🛒 الطلب
let cart=[];

function showOrderMenu(){
content.innerHTML=`
<h2>${text[lang].order}</h2>

<div class="menu-item">🍔 برجر 5 JD <button onclick="add('🍔 برجر',5)">+</button></div>
<div class="menu-item">🍕 بيتزا 8 JD <button onclick="add('🍕 بيتزا',8)">+</button></div>
<div class="menu-item">🥤 عصير 3 JD <button onclick="add('🥤 عصير',3)">+</button></div>

<div class="cart" id="cart"></div>

<button onclick="sendOrder()">${text[lang].send}</button>
`;

updateCart();
}

function add(name,price){
cart.push({name,price});
updateCart();
}

function updateCart(){
let total=0;
let html="<h3>"+text[lang].yourOrder+"</h3>";

cart.forEach(i=>{
html+=i.name+"<br>";
total+=i.price;
});

html+=`<hr>${text[lang].total}: ${total} JD`;

document.getElementById("cart").innerHTML=html;
}

function sendOrder(){
const table=5;

let order="";
cart.forEach(i=>{
order+=i.name+"\\n";
});

fetch("https://script.google.com/macros/s/AKfycbwoDcztWW5XV8zeyniCKI97adi1w8uPVzCZ_TohYwLq1Hc7jSq_gkO9Y-R925fM62iU/exec?table="+table+"&type=order&key=012305&order="+encodeURIComponent(order));

alert("تم إرسال الطلب");

cart=[];
updateCart();
}

function callWaiter(){
fetch("https://script.google.com/macros/s/AKfycbwoDcztWW5XV8zeyniCKI97adi1w8uPVzCZ_TohYwLq1Hc7jSq_gkO9Y-R925fM62iU/exec?table=5&type=waiter&key=012305");
alert("تم طلب ويتر");
}

function requestBill(){
window.open("bill.html?table=5");
}

</script>

</body>
</html>
