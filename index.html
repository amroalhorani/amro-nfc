<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Table</title>

<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: linear-gradient(135deg, #3e2723, #1b1b1b);
  color: #f5e6d3;
  text-align: center;
}

h1 {
  padding: 20px;
  font-size: 34px;
  color: #ffcc80;
}

.lang-btn {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 20px;
  background: #6d4c41;
  border: none;
  color: white;
}

.container {
  display: grid;
  gap: 15px;
  padding: 20px;
}

.card {
  background: #4e342e;
  padding: 25px;
  border-radius: 20px;
  font-size: 22px;
  display: flex;
  justify-content: space-between;
}

.card:hover {
  transform: scale(1.03);
}

.big {
  background:#bf360c;
}

#content {
  padding:20px;
}

img {
  width: 85%;
  margin: 10px;
  border-radius: 10px;
}

/* الطلب */
.menu-item{
  background:#4e342e;
  padding:15px;
  margin:10px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cart{
  background:#2e1c18;
  padding:15px;
  border-radius:15px;
  margin-top:15px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#bf360c;
  color:white;
}

.note-input{
  width:90%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:10px;
}

/* الألعاب */
.games-grid {
  display: grid;
  gap: 15px;
  margin-top: 15px;
}

.game-card {
  background: #4e342e;
  padding: 20px;
  border-radius: 20px;
  text-align: center;
}

.game-icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.game-title {
  font-size: 20px;
  margin-bottom: 10px;
}

.game-actions {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.mic-btn {
  background:#6d4c41;
}
</style>
</head>

<body>

<h1>🍽️ Smart Table</h1>

<button class="lang-btn" onclick="setLang('ar')">عربي</button>
<button class="lang-btn" onclick="setLang('en')">English</button>

<div class="container">

<div class="card">
<span onclick="showMenu()"><span id="menuText">📖 المنيو</span></span>
<span onclick="speak('menu')">🎤</span>
</div>

<div class="card big">
<span onclick="showOrderMenu()"><span id="orderText">🛒 اطلب الآن من مكانك</span></span>
<span onclick="speak('order')">🎤</span>
</div>

<div class="card">
<span onclick="openLocation()"><span id="locText">📍 الموقع</span></span>
<span onclick="speak('location')">🎤</span>
</div>

<div class="card">
<span onclick="showVideo()"><span id="videoText">🎥 فيديو</span></span>
<span onclick="speak('video')">🎤</span>
</div>

<div class="card big">
<span onclick="callWaiter()"><span id="waiterText">🚨 نداء ويتر</span></span>
<span onclick="speak('waiter')">🎤</span>
</div>

<div class="card">
<span onclick="requestBill()"><span id="billText">💰 الفاتورة</span></span>
<span onclick="speak('bill')">🎤</span>
</div>

<div class="card">
<span onclick="showGames()"><span id="gamesText">🎮 ألعاب</span></span>
<span onclick="speak('games')">🎤</span>
</div>

</div>

<div id="content"></div>

<script>

let lang="ar";

const text={
ar:{
menu:"المنيو",
order:"اطلب الآن من مكانك",
location:"الموقع",
video:"فيديو",
waiter:"نداء ويتر",
games:"ألعاب",
bill:"الفاتورة",
send:"إرسال الطلب",
yourOrder:"طلبك",
total:"المجموع",
play:"العب الآن",
note:"اكتب ملاحظة"
},
en:{
menu:"Menu",
order:"Order From Your Seat",
location:"Location",
video:"Video",
waiter:"Call Waiter",
games:"Games",
bill:"Bill",
send:"Send Order",
yourOrder:"Your Order",
total:"Total",
play:"Play Now",
note:"Write note"
}
};

function setLang(l){
lang=l;

menuText.innerText="📖 "+text[l].menu;
orderText.innerText="🛒 "+text[l].order;
locText.innerText="📍 "+text[l].location;
videoText.innerText="🎥 "+text[l].video;
waiterText.innerText="🚨 "+text[l].waiter;
gamesText.innerText="🎮 "+text[l].games;
billText.innerText="💰 "+text[l].bill;
}

function speak(type){
const msg=new SpeechSynthesisUtterance(text[lang][type]);
msg.lang=lang==="ar"?"ar-SA":"en-US";
speechSynthesis.speak(msg);
}

function speakCustom(textToSpeak){
const msg=new SpeechSynthesisUtterance(textToSpeak);
msg.lang=lang==="ar"?"ar-SA":"en-US";
speechSynthesis.speak(msg);
}

function scrollDown(){
window.scrollTo({
top: document.getElementById("content").offsetTop,
behavior: "smooth"
});
}

function showMenu(){

content.innerHTML=`
<h2>${text[lang].menu}</h2>

<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194629/1_fr367x.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/9_ljn4uk.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/4_joqmep.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/5_azsne8.jpg">
<img src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/6_fv3i5l.jpg">
`;

scrollDown();
}

let cart=[];

function showOrderMenu(){

content.innerHTML=`

<h2>${text[lang].order}</h2>

<div class="menu-item">
🍔 برجر 5 JD
<div>
<input class="note-input" id="note1" placeholder="${text[lang].note}">
<button onclick="add('🍔 برجر',5,'note1')">+</button>
</div>
</div>

<div class="menu-item">
🍕 بيتزا 8 JD
<div>
<input class="note-input" id="note2" placeholder="${text[lang].note}">
<button onclick="add('🍕 بيتزا',8,'note2')">+</button>
</div>
</div>

<div class="menu-item">
🥤 عصير 3 JD
<div>
<input class="note-input" id="note3" placeholder="${text[lang].note}">
<button onclick="add('🥤 عصير',3,'note3')">+</button>
</div>
</div>

<div class="menu-item">
🍟 بطاطا 4 JD
<div>
<input class="note-input" id="note4" placeholder="${text[lang].note}">
<button onclick="add('🍟 بطاطا',4,'note4')">+</button>
</div>
</div>

<div class="menu-item">
☕ قهوة 2 JD
<div>
<input class="note-input" id="note5" placeholder="${text[lang].note}">
<button onclick="add('☕ قهوة',2,'note5')">+</button>
</div>
</div>

<div class="menu-item">
🍰 تشيز كيك 6 JD
<div>
<input class="note-input" id="note6" placeholder="${text[lang].note}">
<button onclick="add('🍰 تشيز كيك',6,'note6')">+</button>
</div>
</div>

<div class="cart" id="cart"></div>

<button onclick="sendOrder()">${text[lang].send}</button>
`;

updateCart();
scrollDown();
}

function add(name,price,noteId){

let note=document.getElementById(noteId).value;

let existing=cart.find(item =>
item.name===name && item.note===note
);

if(existing){
existing.qty+=1;
}
else{
cart.push({
name:name,
price:price,
qty:1,
note:note
});
}

updateCart();
}

function updateCart(){

let total=0;

let html="<h3>"+text[lang].yourOrder+"</h3>";

cart.forEach(i=>{

html+=`
<div style="margin:10px 0;">
${i.name} x${i.qty}
<br>
${i.note ? "📝 "+i.note : ""}
</div>
`;

total+=i.price*i.qty;
});

html+=`<hr>${text[lang].total}: ${total} JD`;

document.getElementById("cart").innerHTML=html;
}

function sendOrder(){

const table=5;

if(cart.length===0){
alert("السلة فاضية");
return;
}

let order=JSON.stringify(cart);

fetch("https://script.google.com/macros/s/AKfycbyUhzdAMzh1Qoo_kX-sb4i8fz2vHQDFnOy60FC2faybnKjO3JesoLnnyoKGDuq4xM2I/exec?table="+table+
"&type=order&key=012305&order="+encodeURIComponent(order))

.then(res=>res.text())

.then(data=>{

alert("تم إرسال الطلب");

cart=[];

updateCart();
});
}

function openLocation(){
window.open("https://maps.google.com/?q=Amman");
}

function showVideo(){

content.innerHTML=`
<iframe width="95%" height="250"
src="https://www.youtube.com/embed/5QG4drW8zdY"
allowfullscreen></iframe>
`;

scrollDown();
}

function callWaiter(){

fetch("https://script.google.com/macros/s/AKfycbyUhzdAMzh1Qoo_kX-sb4i8fz2vHQDFnOy60FC2faybnKjO3JesoLnnyoKGDuq4xM2I/exec?table=5&type=waiter&key=012305");

alert("تم طلب ويتر");
}

function requestBill(){
window.open("bill.html?table=5");
}

function showGames(){

content.innerHTML=`

<h2>${text[lang].games}</h2>

<div class="games-grid">

<div class="game-card">
<div class="game-icon">🎨</div>
<div class="game-title">
${lang==="ar"?"لعبة الرسم":"Skribbl.io"}
</div>

<div class="game-actions">

<button onclick="window.open('https://skribbl.io')">
▶️ ${text[lang].play}
</button>

<button class="mic-btn"
onclick="speakCustom('${lang==="ar"?"لعبة رسم":"Drawing game"}')">
🎤
</button>

</div>
</div>

<div class="game-card">
<div class="game-icon">😂</div>
<div class="game-title">
${lang==="ar"?"لعبة جماعية":"Gartic Phone"}
</div>

<div class="game-actions">

<button onclick="window.open('https://garticphone.com')">
▶️ ${text[lang].play}
</button>

<button class="mic-btn"
onclick="speakCustom('${lang==="ar"?"لعبة جماعية":"Party game"}')">
🎤
</button>

</div>
</div>

<div class="game-card">
<div class="game-icon">🧠</div>
<div class="game-title">
${lang==="ar"?"لعبة ذكاء":"Codenames"}
</div>

<div class="game-actions">

<button onclick="window.open('https://codenames.game')">
▶️ ${text[lang].play}
</button>

<button class="mic-btn"
onclick="speakCustom('${lang==="ar"?"لعبة ذكاء":"Brain game"}')">
🎤
</button>

</div>
</div>

<div class="game-card">
<div class="game-icon">🕵️</div>
<div class="game-title">
${lang==="ar"?"لعبة مافيا":"Mafia"}
</div>

<div class="game-actions">

<button onclick="window.open('https://www.jm3tmafia.com/game')">
▶️ ${text[lang].play}
</button>

<button class="mic-btn"
onclick="speakCustom('${lang==="ar"?"لعبة مافيا":"Mafia game"}')">
🎤
</button>

</div>
</div>

</div>
`;

scrollDown();
}

</script>

</body>
</html>
