<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Table</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg, #111, #1c1c1c);
  color: white;
  text-align: center;
}

h1 {
  padding: 20px;
  font-size: 32px;
}

.container {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  padding: 20px;
}

.card {
  background: #222;
  padding: 25px;
  border-radius: 20px;
  font-size: 18px;
  cursor: pointer;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  background: #333;
}

.big {
  grid-column: span 2;
  background: #ff6600;
}

#content {
  padding: 20px;
}
img {
  width: 90%;
  margin: 10px;
  border-radius: 10px;
}
iframe {
  width: 90%;
  height: 220px;
}
a {
  display: block;
  margin: 10px;
  color: #00ccff;
  font-size: 18px;
}
</style>
</head>

<body>

<h1>🍽️ Welcome</h1>

<div class="container">

<div class="card" onclick="showMenu()">📖 المنيو</div>
<div class="card" onclick="openLocation()">📍 الموقع</div>

<div class="card" onclick="showVideo()">🎥 فيديو</div>
<div class="card big" onclick="callWaiter()">🚨 نداء ويتر</div>

<div class="card" onclick="showGames()">🎮 ألعاب</div>

</div>

<div id="content"></div>

<script>

function showMenu(){
  document.getElementById("content").innerHTML = `
    <h2>📖 المنيو</h2>
    <img src="https://via.placeholder.com/400">
    <img src="https://via.placeholder.com/400">
  `;
}

function openLocation(){
  window.open("https://maps.google.com/?q=Amman", "_blank");
}

function showVideo(){
  document.getElementById("content").innerHTML = `
    <h2>🎥 فيديو</h2>
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
  `;
}

function callWaiter(){
  fetch("https://maker.ifttt.com/trigger/call_waiter/with/key/PUT_YOUR_KEY_HERE")
  .then(() => {
    alert("تم طلب الويتر ✅");
  });
}

function showGames(){
  document.getElementById("content").innerHTML = `
    <h2>🎮 ألعاب</h2>
    <a href="https://skribbl.io" target="_blank">🎨 لعبة رسم</a>
    <a href="https://garticphone.com" target="_blank">😂 لعبة جماعية</a>
  `;
}

</script>

</body>
</html>
