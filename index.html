<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Table</title>

<style>
body {
  margin: 0;
  font-family: "Georgia", serif;
  background: linear-gradient(135deg, #3e2723, #1b1b1b);
  color: #f5e6d3;
  text-align: center;
}

h1 {
  padding: 20px;
  font-size: 34px;
  color: #ffcc80;
}

.lang-btn {
  margin: 10px;
  padding: 10px 20px;
  border-radius: 20px;
  background: #6d4c41;
  border: none;
  color: white;
}

.container {
  display: grid;
  gap: 15px;
  padding: 20px;
}

.card {
  background: #4e342e;
  padding: 25px;
  border-radius: 20px;
  font-size: 22px;
  display: flex;
  justify-content: space-between;
}

.big {
  background: #bf360c;
}

#content {
  padding: 20px;
}

/* ✅ تصغير صور المنيو */
.menu-img {
  width: 80%;
  margin: 10px auto;
  border-radius: 10px;
}

/* الألعاب */
.games-grid {
  display: grid;
  gap: 15px;
}

.game-card {
  background: #4e342e;
  padding: 20px;
  border-radius: 20px;
}

button {
  background: #bf360c;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>🍽️ Smart Table</h1>

<button class="lang-btn" onclick="setLang('ar')">عربي</button>
<button class="lang-btn" onclick="setLang('en')">English</button>

<div class="container">

<div class="card">
<span onclick="showMenu()" id="menuText">📖 المنيو</span>
</div>

<div class="card">
<span onclick="openLocation()" id="locText">📍 الموقع</span>
</div>

<div class="card">
<span onclick="showVideo()" id="videoText">🎥 فيديو</span>
</div>

<div class="card big">
<span onclick="callWaiter()" id="waiterText">🚨 نداء ويتر</span>
</div>

<div class="card">
<span onclick="requestBill()" id="billText">💰 الفاتورة</span>
</div>

<div class="card">
<span onclick="showGames()" id="gamesText">🎮 ألعاب</span>
</div>

</div>

<div id="content"></div>

<script>

let lang = "ar";

const text = {
  ar: {
    menu: "المنيو",
    order: "اطلب الآن من مكانك",
    games: "ألعاب"
  },
  en: {
    menu: "Menu",
    order: "Order Now From Your Seat",
    games: "Games"
  }
};

function setLang(l){
  lang = l;
}

// ✅ المنيو + زر الطلب
function showMenu(){
  content.innerHTML = `
    <h2>${text[lang].menu}</h2>

    <img class="menu-img" src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194629/1_fr367x.jpg">
    <img class="menu-img" src="https://res.cloudinary.com/dziozcvsx/image/upload/v1776194630/9_ljn4uk.jpg">

    <button onclick="orderNow()">${text[lang].order}</button>
  `;

  scrollDown();
}

// ✅ زر الطلب
function orderNow(){
  alert("تم فتح الطلب من مكانك 🔥");
}

// الفيديو
function showVideo(){
  content.innerHTML = `
    <h2>🎥 Video</h2>
    <iframe src="https://www.youtube.com/embed/5QG4drW8zdY"></iframe>
  `;
  scrollDown();
}

// الألعاب
function showGames(){
  content.innerHTML = `
    <h2>${text[lang].games}</h2>

    <div class="games-grid">
      <div class="game-card">
        <p>Skribbl</p>
        <button onclick="window.open('https://skribbl.io')">▶️</button>
      </div>
    </div>
  `;
  scrollDown();
}

// الويتر
function callWaiter(){
  fetch("https://script.google.com/macros/s/AKfycbx-SGkGeTKEEnPbPtqpy84TLhd_oKnJ5BKrJaaIhOUTNZL3CbIj0to2A8xevROtVJPk/exec?table=5&type=waiter&key=012305");
  alert("تم طلب الويتر");
}

// الفاتورة
function requestBill(){
  window.open("bill.html?table=5");
}

// 📌 أهم نقطة رجعناها
function scrollDown(){
  window.scrollTo({
    top: document.getElementById("content").offsetTop,
    behavior: "smooth"
  });
}

</script>

</body>
</html>
