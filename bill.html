<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاتورة</title>

<style>
body{
  margin:0;
  font-family: "Georgia", serif;
  background:#2c1b16;
  color:#f5e6d3;
  text-align:center;
}

.container{
  padding:20px;
}

.box{
  background:#4e342e;
  padding:20px;
  border-radius:20px;
  max-width:400px;
  margin:auto;
}

h1{
  color:#ffcc80;
}

.item{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.total{
  margin-top:15px;
  font-size:20px;
  border-top:1px solid #aaa;
  padding-top:10px;
}

button{
  margin:10px;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.pay{background:#bf360c;color:white;}
.cash{background:#2e7d32;color:white;}
.card{background:#1565c0;color:white;}
.download{background:#6d4c41;color:white;}
</style>
</head>

<body>

<div class="container">
<div class="box">

<h1>🧾 فاتورة</h1>

<p id="table"></p>

<div id="items"></div>

<div class="total" id="total"></div>

<button class="pay" onclick="showPayment()">💰 طلب الدفع</button>

<div id="paymentOptions" style="display:none;">
  <button class="cash" onclick="payCash()">💵 كاش</button>
  <button class="card" onclick="payCard()">💳 Visa</button>
</div>

<button class="download" onclick="downloadBill()">📥 تحميل الفاتورة</button>

</div>
</div>

<script>

const urlParams = new URLSearchParams(window.location.search);
const table = urlParams.get("table") || 1;

document.getElementById("table").innerText = "رقم الطاولة: " + table;

// 🔥 رابط السكربت
const baseURL = "https://script.google.com/macros/s/AKfycbyN4JyFcgLtc3EpbINpP3S3uM53zENmlZI8DsvKLKAwpSup4J5C6PWEsXOHNunfdpZW/exec";
const key = "012305";

// =======================
// 🧾 LIVE ORDERS SYSTEM
// =======================

function loadOrders() {

  fetch(baseURL + "?table=" + table + "&type=getOrders&key=" + key)
    .then(res => res.json())
    .then(data => {

      let html = "";
      let total = 0;

      data.forEach(item => {

        html += `
          <div class="item">
            <span>${item.item}</span>
            <span>${item.price} JD</span>
          </div>
        `;

        total += Number(item.price);
      });

      document.getElementById("items").innerHTML = html;
      document.getElementById("total").innerText = "المجموع: " + total + " JD";

    })
    .catch(err => {
      console.log("Error loading orders", err);
    });
}

// أول تحميل
loadOrders();

// تحديث تلقائي كل 3 ثواني
setInterval(loadOrders, 3000);

// =======================
// 💰 الدفع
// =======================

function showPayment(){
  document.getElementById("paymentOptions").style.display = "block";
}

function payCash(){
  fetch(baseURL + "?table=" + table + "&type=cash&key=" + key)
    .then(()=>alert("تم طلب الدفع كاش"));
}

function payCard(){
  fetch(baseURL + "?table=" + table + "&type=card&key=" + key)
    .then(()=>alert("تم طلب الدفع فيزا"));
}

// =======================
// 📥 طباعة
// =======================

function downloadBill(){
  window.print();
}

</script>

</body>
</html>
