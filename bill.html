<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاتورة</title>

<style>
body{
  margin:0;
  font-family: "Georgia", serif;
  background:#1a1a1a;
  color:#f5e6d3;
}

/* هيدر */
.header{
  background: linear-gradient(90deg, #3e2723, #5d4037);
  padding:15px;
  text-align:center;
  font-size:24px;
  color:#ffcc80;
}

/* الصندوق */
.box{
  background:#3e2723;
  padding:20px;
  border-radius:20px;
  max-width:400px;
  margin:30px auto;
  box-shadow:0 8px 20px rgba(0,0,0,0.6);
}

/* عناصر الفاتورة */
.item{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.total{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid #aaa;
  font-size:18px;
}

/* أزرار */
button{
  margin:8px;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.pay{background:#bf360c;color:white;}
.cash{background:#2e7d32;color:white;}
.card{background:#1565c0;color:white;}
.download{background:#6d4c41;color:white;}
</style>
</head>

<body>

<div class="header">🧾 فاتورة</div>

<div class="box">

<p id="table"></p>

<div id="items"></div>

<div class="total" id="total"></div>

<button class="pay" onclick="showPayment()">💰 طلب الدفع</button>

<div id="paymentOptions" style="display:none;">
  <button class="cash" onclick="payCash()">💵 كاش</button>
  <button class="card" onclick="payCard()">💳 Visa</button>
</div>

<button class="download" onclick="downloadBill()">📥 تحميل الفاتورة</button>

</div>

<script>

// رقم الطاولة
const urlParams = new URLSearchParams(window.location.search);
const table = urlParams.get("table") || 1;

document.getElementById("table").innerText = "رقم الطاولة: " + table;

// بيانات تجريبية
const bills = {
  1: [
    {name:"🍔 برجر", price:5},
    {name:"🥤 كولا", price:2}
  ],
  5: [
    {name:"🍕 بيتزا", price:8},
    {name:"🥤 عصير", price:3}
  ],
  7: [
    {name:"🍝 باستا", price:6},
    {name:"☕ قهوة", price:2}
  ]
};

const items = bills[table] || [{name:"🍔 برجر", price:5}];

let total = 0;

items.forEach(item=>{
  document.getElementById("items").innerHTML += `
    <div class="item">
      <span>${item.name}</span>
      <span>${item.price} JD</span>
    </div>
  `;
  total += item.price;
});

document.getElementById("total").innerText = "المجموع: " + total + " JD";

// إظهار الدفع
function showPayment(){
  document.getElementById("paymentOptions").style.display = "block";
}

// نفس سكربتك (ما لمسته)
const baseURL = "https://script.google.com/macros/s/AKfycbwoDcztWW5XV8zeyniCKI97adi1w8uPVzCZ_TohYwLq1Hc7jSq_gkO9Y-R925fM62iU/exec";
const key = "012305";

function payCash(){
  fetch(baseURL + "?table=" + table + "&type=cash&key=" + key)
    .then(()=>alert("تم طلب الدفع كاش"));
}

function payCard(){
  fetch(baseURL + "?table=" + table + "&type=card&key=" + key)
    .then(()=>alert("تم طلب الدفع فيزا"));
}

// تحميل
function downloadBill(){
  window.print();
}

</script>

</body>
</html>
