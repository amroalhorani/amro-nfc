<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>فاتورة</title>

<style>
body{
  margin:0;
  font-family: "Georgia", serif;
  background:#2c1b16;
  color:#f5e6d3;
  text-align:center;
}

.container{
  padding:20px;
}

.box{
  background:#4e342e;
  padding:20px;
  border-radius:20px;
  max-width:500px;
  margin:auto;
}

h1{
  color:#ffcc80;
}

.item{
  background:#3b2722;
  padding:12px;
  border-radius:12px;
  margin:10px 0;
  text-align:right;
}

.item-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
}

.note{
  color:#ffcc80;
  font-size:14px;
}

.total{
  margin-top:15px;
  font-size:22px;
  border-top:1px solid #aaa;
  padding-top:10px;
}

button{
  margin:10px;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}

.pay{
  background:#bf360c;
  color:white;
}

.cash{
  background:#2e7d32;
  color:white;
}

.card{
  background:#1565c0;
  color:white;
}

.download{
  background:#6d4c41;
  color:white;
}
</style>
</head>

<body>

<div class="container">
<div class="box">

<h1>🧾 فاتورة</h1>

<p id="table"></p>

<div id="items"></div>

<div class="total" id="total"></div>

<button class="pay" onclick="showPayment()">💰 طلب الدفع</button>

<div id="paymentOptions" style="display:none;">
  <button class="cash" onclick="payCash()">💵 كاش</button>
  <button class="card" onclick="payCard()">💳 Visa</button>
</div>

<button class="download" onclick="downloadBill()">📥 تحميل الفاتورة</button>

</div>
</div>

<script>

const urlParams = new URLSearchParams(window.location.search);
const table = urlParams.get("table") || 1;

document.getElementById("table").innerText =
"رقم الطاولة: " + table;

const baseURL =
"https://script.google.com/macros/s/AKfycbyUhzdAMzh1Qoo_kX-sb4i8fz2vHQDFnOy60FC2faybnKjO3JesoLnnyoKGDuq4xM2I/exec";

const key = "012305";

// =======================
// 🧾 تحميل الطلبات
// =======================

function loadOrders(){

fetch(
baseURL +
"?table=" + table +
"&type=getOrders&key=" + key
)

.then(res => res.json())

.then(data => {

let html = "";
let total = 0;

data.forEach(item => {

let qty = item.quantity || 1;
let note = item.note || "";

html += `
<div class="item">

<div class="item-top">
<span>${item.item} × ${qty}</span>
<span>${item.price * qty} JD</span>
</div>

${note ? `<div class="note">📝 ${note}</div>` : ""}

</div>
`;

total += Number(item.price) * Number(qty);

});

document.getElementById("items").innerHTML = html;

document.getElementById("total").innerText =
"المجموع: " + total + " JD";

})

.catch(err => {
console.log(err);
});

}

// أول تحميل
loadOrders();

// تحديث تلقائي
setInterval(loadOrders,3000);

// =======================
// 💰 الدفع
// =======================

function showPayment(){

document.getElementById("paymentOptions").style.display = "block";

}

function payCash(){

fetch(
baseURL +
"?table=" + table +
"&type=cash&key=" + key
)

.then(() => {
alert("تم طلب الدفع كاش");
});

}

function payCard(){

fetch(
baseURL +
"?table=" + table +
"&type=card&key=" + key
)

.then(() => {
alert("تم طلب الدفع فيزا");
});

}

// =======================
// 📥 طباعة
// =======================

function downloadBill(){

window.print();

}

</script>

</body>
</html>
